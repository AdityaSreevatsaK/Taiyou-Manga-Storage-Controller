name: Format selected importer branch (temporary)

on:
  push:
    branches: [feat/selected-manga-private-hf-ingest-20261120]
    paths: ['.github/workflows/format-selected-branch.yml']

permissions:
  contents: write

jobs:
  clean:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install code style formatter
        run: python -m pip install "ruff>=0.9,<1"
      - name: Fix style in only new selected import paths
        run: |
          python -m ruff check --fix \
            scripts/fetch_selected_manga_artifacts.py \
            src/taiyou_manga/selected_titles.py \
            src/taiyou_manga/selected_stage.py \
            src/taiyou_manga/selected_hf_upload.py \
            tests/test_selected_stage.py \
            tests/test_selected_hf_upload.py || true
          python -m ruff format \
            scripts/fetch_selected_manga_artifacts.py \
            src/taiyou_manga/selected_titles.py \
            src/taiyou_manga/selected_stage.py \
            src/taiyou_manga/selected_hf_upload.py \
            tests/test_selected_stage.py \
            tests/test_selected_hf_upload.py
      - name: Commit only resulting formatter changes to own feature branch
        shell: bash
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add scripts/fetch_selected_manga_artifacts.py \
              src/taiyou_manga/selected_titles.py \
              src/taiyou_manga/selected_stage.py \
              src/taiyou_manga/selected_hf_upload.py \
              tests/test_selected_stage.py \
              tests/test_selected_hf_upload.py
            git commit -m "style: Ruff-format selected manga upload source"
            git push origin HEAD:feat/selected-manga-private-hf-ingest-20261120
          fi
