name: Retired legacy ReLIFE uploader (migration required)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  blocked-legacy-write:
    runs-on: ubuntu-latest
    steps:
      - name: Prevent obsolete root-catalogue Hugging Face writes
        shell: bash
        run: |
          echo "::error::The old ReLIFE uploader was retired after its successful first transfer."
          echo "::error::Use the private backup and canonical data/library.json migration procedure."
          exit 1

# Original ReLIFE media remains untouched in private Hugging Face storage.
# This workflow cannot download, upload, delete or overwrite manga files.
