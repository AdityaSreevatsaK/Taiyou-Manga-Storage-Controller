name: Temporary formatter for controller feature branch
on:
  push:
    branches:
      - feat/offline-controller-foundation
    paths:
      - .github/workflows/format-once.yml
permissions:
  contents: write
jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/offline-controller-foundation
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'ruff>=0.9,<1'
      - name: Apply safe Ruff formatting and fixes
        run: |
          python -m ruff format .
          python -m ruff check --fix . || true
          python -m ruff format .
      - name: Commit changes only if needed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src tests pyproject.toml
          if ! git diff --cached --quiet; then
            git commit -m "style: normalise formatting and safe lint fixes"
            git push origin HEAD:feat/offline-controller-foundation
          fi
