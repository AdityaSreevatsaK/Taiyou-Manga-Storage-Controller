name: Format Acquainted JPEG repair tests (temporary)
on:
  push:
    branches: [fix/acquainted-corrupt-page-diagnostics-20261121]
    paths: ['.github/workflows/format-acquainted-repair.yml']
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/acquainted-corrupt-page-diagnostics-20261121
          persist-credentials: true
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: python -m pip install 'ruff>=0.9,<1'
      - name: Format import and regression test files
        run: |
          python -m ruff format scripts/acquainted_image_repair.py scripts/upload_acquainted_windows.py tests/test_acquainted_image_repair.py
          python -m ruff check --fix scripts/acquainted_image_repair.py scripts/upload_acquainted_windows.py tests/test_acquainted_image_repair.py
      - name: Commit formatting
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -- scripts/acquainted_image_repair.py scripts/upload_acquainted_windows.py tests/test_acquainted_image_repair.py
            git commit -m "style: format reviewable corrupted JPEG diagnostics"
            git push origin HEAD:fix/acquainted-corrupt-page-diagnostics-20261121
          fi
