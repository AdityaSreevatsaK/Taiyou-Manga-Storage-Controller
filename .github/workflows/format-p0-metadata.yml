name: Format P0 manga metadata branch (temporary)
on:
  push:
    branches: [feat/p0-canonical-metadata-reconciliation-20261120]
    paths: ['.github/workflows/format-p0-metadata.yml']
permissions:
  contents: write
jobs:
  formatter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/p0-canonical-metadata-reconciliation-20261120
          persist-credentials: true
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: python -m pip install 'ruff>=0.9,<1'
      - name: Format and apply safe lint fixes
        run: |
          python -m ruff format src/taiyou_manga/metadata.py src/taiyou_manga/hf_metadata.py src/taiyou_manga/hf_layout.py tests/test_metadata.py
          python -m ruff check --fix src/taiyou_manga/metadata.py src/taiyou_manga/hf_metadata.py src/taiyou_manga/hf_layout.py tests/test_metadata.py
      - name: Commit formatting only
        shell: bash
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -- src/taiyou_manga/metadata.py src/taiyou_manga/hf_metadata.py src/taiyou_manga/hf_layout.py tests/test_metadata.py
            git commit -m "style: format P0 metadata validation and reconciliation"
            git push origin HEAD:feat/p0-canonical-metadata-reconciliation-20261120
          fi
