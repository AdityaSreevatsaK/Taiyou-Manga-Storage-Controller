name: Verify private Manga Hugging Face dataset (read-only)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hf-manga-readonly-verify
  cancel-in-progress: false

jobs:
  private-dataset-health:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: hf-manga-upload
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install read-only HF client
        run: |
          python -m pip install --upgrade "setuptools>=84.1.0"
          python -m pip install -e ".[huggingface]"
      - name: Verify the explicitly approved private dataset
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        shell: bash
        run: |
          if [[ -z "${HF_TOKEN}" ]]; then
            echo "::error::Missing HF_TOKEN in the hf-manga-upload environment"
            exit 1
          fi
          python -m taiyou_manga hf-health --repo-id "AdityaSreevatsaK/Taiyous-Manga"
