name: Format selected-manga canonical upload branch once
on:
  push:
    branches: [feat/selected-manga-canonical-intake-20261120]
    paths: ['.github/workflows/format-selected-manga.yml']
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/selected-manga-canonical-intake-20261120
          persist-credentials: true
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: python -m pip install 'ruff>=0.9,<1'
      - name: Format source and fix safe lint
        run: |
          python -m ruff format .
          python -m ruff check --fix .
      - name: Commit formatted Python only
        shell: bash
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -- src/taiyou_manga tests scripts
            git commit -m "style: format selected manga canonical importer"
            git push origin HEAD:feat/selected-manga-canonical-intake-20261120
          fi
