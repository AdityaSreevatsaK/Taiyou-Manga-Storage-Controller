name: Format flat manga helper (temporary)
on:
  push:
    branches: [feat/flat-numbered-manga-upload-helper-20261120]
    paths: ['.github/workflows/format-flat-manga.yml']
permissions:
  contents: write
jobs:
  formatter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/flat-numbered-manga-upload-helper-20261120
          persist-credentials: true
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: python -m pip install 'ruff>=0.9,<1'
      - name: Apply Ruff format and safe fixes
        run: |
          python -m ruff format src/taiyou_manga/flat_import.py src/taiyou_manga/builder.py src/taiyou_manga/cli.py src/taiyou_manga/hf_cli.py tests/test_flat_import.py
          python -m ruff check --fix src/taiyou_manga/flat_import.py src/taiyou_manga/builder.py src/taiyou_manga/cli.py src/taiyou_manga/hf_cli.py tests/test_flat_import.py
      - name: Commit formatting
        shell: bash
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -- src/taiyou_manga/flat_import.py src/taiyou_manga/builder.py src/taiyou_manga/cli.py src/taiyou_manga/hf_cli.py tests/test_flat_import.py
            git commit -m "style: format numbered manga import adapter"
            git push origin HEAD:feat/flat-numbered-manga-upload-helper-20261120
          fi
