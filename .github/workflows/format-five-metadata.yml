name: Format five-cover source adapter (temporary)
on:
  push:
    branches: [feat/p0-five-manga-metadata-private-backfill-20261120]
    paths: ['.github/workflows/format-five-metadata.yml']
permissions:
  contents: write
jobs:
  formatter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/p0-five-manga-metadata-private-backfill-20261120
          persist-credentials: true
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: python -m pip install 'ruff>=0.9,<1'
      - name: Format source adapter
        run: |
          python -m ruff format scripts/prepare_five_metadata_handover.py
          python -m ruff check --fix scripts/prepare_five_metadata_handover.py
      - name: Commit format
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -- scripts/prepare_five_metadata_handover.py
            git commit -m "style: format five-title owner metadata source adapter"
            git push origin HEAD:feat/p0-five-manga-metadata-private-backfill-20261120
          fi
