name: Format Windows Acquainted import assistant (temporary)
on:
  push:
    branches: [feat/windows-acquainted-two-zip-upload-20261120]
    paths: ['.github/workflows/format-acquainted-windows.yml']
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/windows-acquainted-two-zip-upload-20261120
          persist-credentials: true
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: python -m pip install 'ruff>=0.9,<1'
      - name: Format Windows upload and tests
        run: |
          python -m ruff format scripts/upload_acquainted_windows.py tests/test_windows_acquainted_upload.py
          python -m ruff check --fix scripts/upload_acquainted_windows.py tests/test_windows_acquainted_upload.py
      - name: Commit formatting
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -- scripts/upload_acquainted_windows.py tests/test_windows_acquainted_upload.py
            git commit -m "style: format verified Windows manga uploader"
            git push origin HEAD:feat/windows-acquainted-two-zip-upload-20261120
          fi
