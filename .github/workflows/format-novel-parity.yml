name: Format Novel-style manga Controller feature branch (temporary)
on:
  push:
    branches: [feat/novel-controller-feature-parity-20261120]
    paths: ['.github/workflows/format-novel-parity.yml']
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/novel-controller-feature-parity-20261120
          persist-credentials: true
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: python -m pip install 'ruff>=0.9,<1'
      - name: Format and fix safe lint issues
        run: |
          python -m ruff format src/taiyou_manga/hf_manage.py src/taiyou_manga/hf_bulk.py src/taiyou_manga/hf_extra.py src/taiyou_manga/hf_cli.py src/taiyou_manga/cli.py tests/test_hf_operations.py
          python -m ruff check --fix src/taiyou_manga/hf_manage.py src/taiyou_manga/hf_bulk.py src/taiyou_manga/hf_extra.py src/taiyou_manga/hf_cli.py src/taiyou_manga/cli.py tests/test_hf_operations.py
      - name: Commit formatting
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -- src/taiyou_manga/hf_manage.py src/taiyou_manga/hf_bulk.py src/taiyou_manga/hf_extra.py src/taiyou_manga/hf_cli.py src/taiyou_manga/cli.py tests/test_hf_operations.py
            git commit -m "style: format manga storage management modules"
            git push origin HEAD:feat/novel-controller-feature-parity-20261120
          fi
