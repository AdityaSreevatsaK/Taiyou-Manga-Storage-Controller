name: Format canonical HF migration branch (temporary)

on:
  push:
    branches: [feat/canonical-hf-manga-contract-and-safe-preview-20261120]
    paths: ['.github/workflows/format-hf-layout-branch.yml']

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install formatter
        run: python -m pip install "ruff>=0.9,<1"
      - name: Format only new canonical layout and recovery code
        run: |
          python -m ruff format src/taiyou_manga/hf_layout.py src/taiyou_manga/hf_recovery.py tests/test_hf_layout.py tests/test_hf_recovery.py
      - name: Push formatting changes only to this feature branch
        shell: bash
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/taiyou_manga/hf_layout.py src/taiyou_manga/hf_recovery.py tests/test_hf_layout.py tests/test_hf_recovery.py
            git commit -m "style: format canonical HF layout and recovery tests"
            git push origin HEAD:feat/canonical-hf-manga-contract-and-safe-preview-20261120
          fi
